# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# CI never deploys. See docs/measurement/KPI-PLAN.md for the deploy gap.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      # The build type-checks and lints too, now that next.config.ts no longer suppresses errors.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
